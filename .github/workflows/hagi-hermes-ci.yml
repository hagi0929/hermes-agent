name: Hermes CI and production promotion

on:
  push:
    branches: [hagi]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hagi-hermes-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'hagi0929/hermes-agent' && github.ref == 'refs/heads/hagi'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      sha: ${{ steps.candidate.outputs.sha }}
      changed: ${{ steps.candidate.outputs.changed }}
      merged: ${{ steps.candidate.outputs.merged }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: candidate
        name: Merge the latest upstream stable release
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          tag=$(curl --fail --silent --show-error --retry 3 \
            https://api.github.com/repos/NousResearch/hermes-agent/releases/latest |
            jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))')
          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git \
            "refs/tags/$tag:refs/upstream/stable"
          upstream=$(git rev-parse 'refs/upstream/stable^{commit}')
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            merge --no-ff --no-edit -m "Merge Hermes upstream $tag" "$upstream"
          sha=$(git rev-parse HEAD)
          production=$(git ls-remote origin refs/heads/production | cut -f1)
          changed=false
          merged=false
          if [[ "$sha" != "$production" ]]; then changed=true; fi
          if [[ "$sha" != "$base" ]]; then merged=true; fi
          printf 'base=%s\nsha=%s\nchanged=%s\nmerged=%s\n' "$base" "$sha" "$changed" "$merged" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: steps.candidate.outputs.changed == 'true'
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Check Hermes CLI, configuration, and profiles
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-test
        run: |
          set -euo pipefail
          uv sync --locked --python 3.14 --group dev
          uv run --no-sync hermes --help
          uv run --no-sync python -m pytest -q \
            tests/tui_gateway/test_profiles_list_worker_session.py \
            tests/tui_gateway/test_profiles_toolset_pin.py \
            tests/tui_gateway/test_config_set_display_toggles.py
      - name: Bundle the verified upstream merge
        if: steps.candidate.outputs.merged == 'true'
        env:
          BASE: ${{ steps.candidate.outputs.base }}
        run: |
          git branch ci-candidate HEAD
          git bundle create "$RUNNER_TEMP/hermes-candidate.bundle" ci-candidate "^$BASE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.candidate.outputs.merged == 'true'
        with:
          name: hermes-candidate
          path: ${{ runner.temp }}/hermes-candidate.bundle
          retention-days: 2
          if-no-files-found: error

  promote:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.verify.outputs.merged == 'true'
        with:
          name: hermes-candidate
          path: ${{ runner.temp }}
      - name: Publish only the verified commit
        shell: bash
        env:
          BASE: ${{ needs.verify.outputs.base }}
          CANDIDATE: ${{ needs.verify.outputs.sha }}
          MERGED: ${{ needs.verify.outputs.merged }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[a-f0-9]{40}$ && "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$MERGED" == true ]]; then
            git bundle verify "$RUNNER_TEMP/hermes-candidate.bundle"
            git fetch "$RUNNER_TEMP/hermes-candidate.bundle" refs/heads/ci-candidate
            [[ "$(git rev-parse FETCH_HEAD)" == "$CANDIDATE" ]]
          fi
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
          [[ "$(git ls-remote origin refs/heads/hagi | cut -f1)" == "$BASE" ]]
          git push --atomic origin "$CANDIDATE:refs/heads/hagi" "$CANDIDATE:refs/heads/production"
